    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ponytail: X-Frame-Options / HSTS / nosniff / Permissions-Policy are ignored
         as <meta> tags — browsers only honor them as real HTTP headers. Set them
         at the hosting layer (and move this CSP into a header with a nonce to
         drop 'unsafe-inline'; the inline value stays for Vite's dev preamble). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com 'unsafe-inline'; connect-src 'self' https://*.supabase.co https://*.clerk.accounts.dev https://clerk-telemetry.com https://challenges.cloudflare.com https://photon.komoot.io; frame-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>ExoGuard · Custody-Infrastruktur für beschlagnahmte Exoten</title>
