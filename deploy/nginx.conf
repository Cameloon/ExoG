# ExoGuard / BioSteward — nginx vhost (static SPA).
#
# Target: /etc/nginx/sites-available/exog on the daew.pro box (nginx 1.28.3).
#
# Deliberately HTTP-only at first: the certificate for exog.daew.pro does not
# exist yet, and a vhost that references a missing cert file makes `nginx -t`
# fail — which also stops certbot from validating the config. So:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/exog
#   sudo ln -s /etc/nginx/sites-available/exog /etc/nginx/sites-enabled/exog
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d exog.daew.pro --redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot clones this block for :443 (root, locations and headers come with it),
# installs the cert and turns this block into the redirect — no hand-editing.
# Afterwards verify the headers on https (DEPLOY.md §7); if the generated :443
# block has no HTTP/2, add `http2 on;` inside it.
#
# No backend on this box: no port, no systemd unit, no .env, no UFW change.
# The browser talks to Supabase/Clerk directly; nginx only serves files.
#
# Headers mirror public/_headers (Netlify/CF-Pages format, ignored by nginx).
# Per the VPS guide §8 (add_header inheritance): the locations below use only
# `expires`, so nothing is dropped. Any location that adds a header must
# re-declare the whole block.

server {
    listen 80;
    listen [::]:80;
    server_name exog.daew.pro;

    root /var/www/exog;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────────
    # CSP here has no 'unsafe-inline' in script-src; index.html's <meta> fallback
    # still carries it for the Vite dev preamble — this header wins in prod.
    # If Clerk moves to a production instance on clerk.daew.pro, add that host
    # to script-src/connect-src/frame-src here and in public/_headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co https://*.clerk.accounts.dev https://clerk-telemetry.com https://challenges.cloudflare.com https://photon.komoot.io; frame-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Vite emits content-hashed filenames here — immutable.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # SPA fallback: /dashboard, /admin, … must render the app, not 404.
    # index.html itself revalidates by ETag, so deploys are picked up.
    location / {
        try_files $uri /index.html;
    }
}
